<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Futebol do Henrique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a2413; color: #fff; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%; outline: none; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; }
  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 6px 16px; background: rgba(0,0,0,.55); border-radius: 12px; font-weight: 700; font-size: clamp(15px, 3vw, 24px); z-index: 5; white-space: nowrap; }
  .team { display: flex; align-items: center; gap: 8px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
  #score { min-width: 76px; text-align: center; font-size: 1.3em; font-variant-numeric: tabular-nums; }
  #time { font-variant-numeric: tabular-nums; opacity: .9; }
  #camBtn { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 5; padding: 8px 12px; border: none; border-radius: 10px; background: rgba(0,0,0,.55); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  #chargeWrap { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 220px; height: 14px; background: rgba(0,0,0,.5); border: 2px solid #fff; border-radius: 8px; overflow: hidden; z-index: 5; opacity: 0; transition: opacity .15s; }
  #chargeWrap.on { opacity: 1; }
  #charge { height: 100%; width: 0; background: #ffd23f; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 10; padding: 16px; }
  #overlay.hidden { display: none; }
  .panel { background: #123d22; border: 3px solid #fff; border-radius: 16px; padding: 24px 28px; text-align: center; max-width: 560px; }
  .panel h1 { font-size: clamp(26px, 6vw, 44px); margin-bottom: 10px; }
  .panel p { margin: 8px 0; line-height: 1.5; opacity: .95; }
  .panel .keys { font-size: 14px; opacity: .85; margin: 14px 0; line-height: 1.6; }
  .btn { display: inline-block; margin: 6px; padding: 12px 22px; font-size: 18px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; background: #ffd23f; color: #222; }
  .btn.sel { outline: 4px solid #fff; }
  .btn.alt { background: #e9e9e9; }
  #msg { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: clamp(40px, 12vw, 110px); font-weight: 900; color: #ffd23f; text-shadow: 0 4px 0 #000, 0 0 30px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 6; }
  #msg.show { opacity: 1; }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 4; }
  #touch.on { display: block; }
  #stick { position: absolute; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.15); border: 3px solid rgba(255,255,255,.4); pointer-events: auto; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #kickBtn, #sprintBtn, #passBtn { position: absolute; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #222; }
  #kickBtn { right: 24px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); width: 100px; height: 100px; background: rgba(255,210,63,.85); font-size: 18px; }
  #sprintBtn { right: 140px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 70px; height: 70px; background: rgba(255,255,255,.7); font-size: 13px; }
  #passBtn { right: 40px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; background: rgba(120,200,255,.85); font-size: 15px; }
  #touch.on ~ #chargeWrap { bottom: 170px; }
</style>
</head>
<body>
<div id="wrap" tabindex="-1">
  <div id="view"></div>
  <div id="hud">
    <div class="team"><div class="dot" style="background:#2f7bff"></div><span>VOCÊ</span></div>
    <div id="score">0 x 0</div>
    <div class="team"><span>CPU</span><div class="dot" style="background:#ff3b3b"></div></div>
    <div id="time">2:00</div>
  </div>
  <button id="camBtn">🎥 Câmera</button>
  <div id="msg"></div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="sprintBtn">CORRER</div>
    <div id="passBtn">PASSE</div>
    <div id="kickBtn">CHUTAR</div>
  </div>
  <div id="chargeWrap"><div id="charge"></div></div>

  <div id="overlay">
    <div class="panel" id="panel"><h1>Carregando…</h1></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) {
    document.getElementById('panel').innerHTML = '<h1>Ops!</h1><p>Não foi possível carregar o motor 3D. Verifique a internet e recarregue a página.</p>';
    return;
  }

  // ---------- Configuração do campo (unidades do jogo) ----------
  const W = 1000, H = 600;
  const F = { l: 50, r: 950, t: 30, b: 570 };            // limites do campo
  const GOAL_TOP = 245, GOAL_BOT = 355, GOAL_DEPTH = 32;   // gol
  const CROSSBAR = 55;                                     // altura do travessão
  const MATCH_TIME = 120;
  const PR = 14, BR = 8;                                   // raios jogador / bola
  const GRAVITY = 900;

  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const msgEl = document.getElementById('msg');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const chargeWrap = document.getElementById('chargeWrap');
  const chargeEl = document.getElementById('charge');

  // ---------- Som ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.08) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    kick: () => beep(180, 0.08, 'triangle', 0.15),
    whistle: () => { beep(2200, 0.15, 'sine', 0.06); setTimeout(() => beep(2200, 0.35, 'sine', 0.06), 180); },
    goal: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.07), i * 120)),
  };

  // ---------- Estado ----------
  const DIFF = {
    facil:   { name: 'Fácil',   speed: 0.78, shoot: 260, err: 70 },
    normal:  { name: 'Normal',  speed: 0.92, shoot: 320, err: 45 },
    dificil: { name: 'Difícil', speed: 1.05, shoot: 380, err: 25 },
  };
  let diff = 'normal';
  let players = [], ball, score = [0, 0], timeLeft = MATCH_TIME;
  let state = 'menu';   // menu | play | goal | pause | end
  let pauseTimer = 0, controlled = null, charge = 0, charging = false;
  let passTarget = null, passTimer = 0, passWas = false;
  let camMode = 0;      // 0 = TV, 1 = atrás do jogador

  function makePlayer(team, role, hx, hy, num) {
    return { team, role, hx, hy, x: hx, y: hy, vx: 0, vy: 0, fx: team === 0 ? 1 : -1, fy: 0, num, cd: 0, anim: 0 };
  }

  function setupTeams() {
    players = [
      makePlayer(0, 'gk', 72, 300, 1),
      makePlayer(0, 'df', 250, 300, 4),
      makePlayer(0, 'fw', 400, 190, 9),
      makePlayer(0, 'fw', 400, 410, 10),
      makePlayer(1, 'gk', W - 72, 300, 1),
      makePlayer(1, 'df', W - 250, 300, 4),
      makePlayer(1, 'fw', W - 400, 190, 9),
      makePlayer(1, 'fw', W - 400, 410, 10),
    ];
    buildPlayerMeshes();
  }

  function kickoff(towardTeam) {
    for (const p of players) { p.x = p.hx; p.y = p.hy; p.vx = p.vy = 0; p.cd = 0; p.fx = p.team === 0 ? 1 : -1; p.fy = 0; }
    // o time que sofreu o gol sai com a bola
    const starter = players.find(p => p.team === towardTeam && p.num === 9);
    starter.x = W / 2 + (towardTeam === 0 ? -24 : 24); starter.y = H / 2;
    ball = { x: W / 2, y: H / 2, z: 0, vx: 0, vy: 0, vz: 0, spin: 0 };
    controlled = players[2];
    charge = 0; charging = false; passTimer = 0; passTarget = null;
  }

  function newGame() {
    score = [0, 0]; timeLeft = MATCH_TIME;
    setupTeams();
    kickoff(0);
    state = 'play';
    overlay.classList.add('hidden');
    grabFocus();
    updateHud();
    sfx.whistle();
  }

  function updateHud() {
    scoreEl.textContent = `${score[0]} x ${score[1]}`;
    const t = Math.max(0, Math.ceil(timeLeft));
    timeEl.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }

  function flash(text, ms = 1500) {
    msgEl.textContent = text; msgEl.classList.add('show');
    clearTimeout(flash.t); flash.t = setTimeout(() => msgEl.classList.remove('show'), ms);
  }

  // ---------- Entrada ----------
  const keys = {};
  const touchIn = { x: 0, y: 0, kick: false, sprint: false, pass: false };
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;
    if ((k === 'p' || k === 'escape') && (state === 'play' || state === 'pause')) togglePause();
    if (k === 'enter' && (state === 'menu' || state === 'end')) newGame();
    if (k === 'c') camMode = 1 - camMode;
  });
  // garante que o teclado vá para o jogo (ex.: quando aberto dentro de outra página)
  const wrapEl = document.getElementById('wrap');
  function grabFocus() { try { window.focus(); wrapEl.focus({ preventScroll: true }); } catch (e) {} }
  wrapEl.addEventListener('pointerdown', e => { if (!e.target.closest('button')) grabFocus(); });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  document.getElementById('camBtn').addEventListener('click', e => { camMode = 1 - camMode; e.currentTarget.blur(); });

  function kickHeld() { return keys[' '] || keys['k'] || keys['j'] || touchIn.kick; }
  function passHeld() { return keys['x'] || keys['e'] || touchIn.pass; }
  function sprintHeld() { return keys['shift'] || keys['l'] || touchIn.sprint; }
  function inputDir() {
    let x = 0, y = 0;
    if (keys['arrowleft'] || keys['a']) x -= 1;
    if (keys['arrowright'] || keys['d']) x += 1;
    if (keys['arrowup'] || keys['w']) y -= 1;
    if (keys['arrowdown'] || keys['s']) y += 1;
    x += touchIn.x; y += touchIn.y;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    // na câmera atrás do jogador, "para cima" é em direção ao gol adversário
    return camMode === 1 ? { x: -y, y: x } : { x, y };
  }

  // Controles de toque
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) document.getElementById('touch').classList.add('on');
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let stickId = null;
  function stickMove(t) {
    const r = stick.getBoundingClientRect();
    let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
    const max = r.width / 2, m = Math.hypot(dx, dy);
    if (m > max) { dx = dx / m * max; dy = dy / m * max; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    touchIn.x = dx / max; touchIn.y = dy / max;
  }
  stick.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; stickId = t.identifier; stickMove(t); });
  stick.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === stickId) stickMove(t); });
  const stickEnd = e => { for (const t of e.changedTouches) if (t.identifier === stickId) { stickId = null; touchIn.x = touchIn.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('touchend', stickEnd); stick.addEventListener('touchcancel', stickEnd);
  function holdBtn(el, prop) {
    el.addEventListener('touchstart', e => { e.preventDefault(); touchIn[prop] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); touchIn[prop] = false; });
    el.addEventListener('touchcancel', () => { touchIn[prop] = false; });
  }
  holdBtn(document.getElementById('kickBtn'), 'kick');
  holdBtn(document.getElementById('sprintBtn'), 'sprint');
  holdBtn(document.getElementById('passBtn'), 'pass');

  // ---------- Utilidades ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);
  function goalX(team) { return team === 0 ? F.r : F.l; }          // gol que o time ATACA
  function ownGoalX(team) { return team === 0 ? F.l : F.r; }

  function kickBall(p, dx, dy, power, lift = 0) {
    const m = Math.hypot(dx, dy) || 1;
    ball.vx = dx / m * power; ball.vy = dy / m * power;
    ball.vz = lift;
    ball.spin = rand(-1, 1);
    p.cd = 0.35;
    p.kickAnim = 0.25;
    sfx.kick();
  }

  function canKick(p) { return p.cd <= 0 && ball.z < 35 && dist(p, ball) < PR + BR + 10; }

  // distância de um ponto a um segmento (para ver se o passe está livre)
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
    const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  // melhor companheiro para receber: livre, na direção preferida e mais perto do gol
  function bestMate(p, dx, dy) {
    let best = null, bestScore = -Infinity;
    const dm = Math.hypot(dx, dy) || 1;
    for (const m of players) {
      if (m === p || m.team !== p.team || m.role === 'gk') continue;
      const d = dist(p, m);
      if (d < 50 || d > 520) continue;
      const blocked = players.some(q => q.team !== p.team && segDist(q.x, q.y, p.x, p.y, m.x, m.y) < 20);
      if (blocked) continue;
      const marked = players.filter(q => q.team !== p.team && dist(q, m) < 45).length;
      const dir = ((m.x - p.x) * dx + (m.y - p.y) * dy) / (d * dm);
      const gdist = Math.abs(goalX(p.team) - m.x);
      const score = dir * 120 - gdist * 0.15 - marked * 60 - d * 0.05;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    return best;
  }

  function passTo(p, m) {
    const tx = m.x + m.vx * 0.35, ty = m.y + m.vy * 0.35;
    const d = Math.hypot(tx - p.x, ty - p.y);
    const lob = players.some(q => q.team !== p.team && segDist(q.x, q.y, p.x, p.y, tx, ty) < 18);
    kickBall(p, tx - p.x, ty - p.y, clamp(d * 1.5 + 180, 300, 720), lob ? 240 : 0);
    passTarget = m; passTimer = 1.2;
  }

  // ---------- IA ----------
  function moveToward(p, tx, ty, speed, dt) {
    const dx = tx - p.x, dy = ty - p.y, m = Math.hypot(dx, dy);
    let dvx = 0, dvy = 0;
    if (m > 3) { const s = Math.min(speed, m * 6); dvx = dx / m * s; dvy = dy / m * s; }
    steer(p, dvx, dvy, dt);
  }

  function steer(p, dvx, dvy, dt) {
    const a = Math.min(1, dt * 10);
    p.vx += (dvx - p.vx) * a; p.vy += (dvy - p.vy) * a;
    const m = Math.hypot(p.vx, p.vy);
    if (m > 20) { p.fx = p.vx / m; p.fy = p.vy / m; }
  }

  function aiGoalkeeper(p, dt, spd) {
    const gx = ownGoalX(p.team), dir = p.team === 0 ? 1 : -1;
    const ballNear = Math.abs(ball.x - gx) < 170 && ball.y > GOAL_TOP - 80 && ball.y < GOAL_BOT + 80;
    let tx, ty;
    if (ballNear) { tx = ball.x; ty = ball.y; }
    else {
      tx = gx + dir * 22;
      // antecipa trajetória da bola
      let py = ball.y;
      if (ball.vx * dir < -50) { const t = (tx - ball.x) / ball.vx; if (t > 0 && t < 2) py = ball.y + ball.vy * t; }
      ty = clamp(py, GOAL_TOP + 8, GOAL_BOT - 8);
    }
    tx = clamp(tx, Math.min(gx, gx + dir * 120), Math.max(gx, gx + dir * 120));
    moveToward(p, tx, ty, 190 * spd, dt);
    if (canKick(p)) {
      const mate = players.filter(q => q.team === p.team && q.role !== 'gk').sort((a, b) => dist(a, p) - dist(b, p))[1];
      const target = mate || { x: W / 2, y: H / 2 };
      kickBall(p, target.x - p.x + dir * 150, target.y - p.y, 620, 260);
    }
  }

  function aiFieldPlayer(p, dt, spd, isChaser) {
    const cfg = DIFF[diff];
    const gx = goalX(p.team), dir = p.team === 0 ? 1 : -1;
    const isCpu = p.team === 1;
    const shootRange = isCpu ? cfg.shoot : 320;
    const err = isCpu ? cfg.err : 45;

    if (isChaser) {
      // posicionar atrás da bola em relação ao gol adversário
      const gdx = gx - ball.x, gdy = H / 2 - ball.y, gm = Math.hypot(gdx, gdy);
      const ux = gdx / gm, uy = gdy / gm;
      const toBx = ball.x - p.x, toBy = ball.y - p.y, tm = Math.hypot(toBx, toBy) || 1;
      const behind = (toBx * ux + toBy * uy) / tm;
      let tx, ty;
      if (behind > 0.3 || tm > 120) { tx = ball.x - ux * 6 + ball.vx * 0.12; ty = ball.y - uy * 6 + ball.vy * 0.12; }
      else { // contornar a bola
        const side = (toBx * uy - toBy * ux) > 0 ? 1 : -1;
        tx = ball.x - ux * 30 - uy * 24 * side; ty = ball.y - uy * 30 + ux * 24 * side;
      }
      moveToward(p, tx, ty, 230 * spd, dt);

      if (canKick(p)) {
        const dGoal = Math.hypot(gx - p.x, H / 2 - p.y);
        if (dGoal < shootRange) {
          kickBall(p, gx - p.x, rand(GOAL_TOP + 12, GOAL_BOT - 12) + rand(-err, err) * 0.5 - p.y, 780, rand(0, 170));
        } else {
          // jogo coletivo: sob pressão passa; livre, às vezes toca para quem está mais avançado
          const pressed = players.some(q => q.team !== p.team && dist(q, p) < 60 && (q.x - p.x) * dir > -10);
          const mate = bestMate(p, dir, 0);
          const aheadBy = mate ? (mate.x - p.x) * dir : 0;
          if (pressed && mate) passTo(p, mate);
          else if (pressed) kickBall(p, dir, rand(-0.4, 0.4), 600, 220);
          else if (mate && aheadBy > 60 && Math.random() < 0.35) passTo(p, mate);
          else if (behind > 0.6) {
            // conduzir: toque curto para frente
            kickBall(p, ux, uy, 260 * spd);
            p.cd = 0.25;
          }
        }
      }
    } else {
      // posição tática
      const bx = ball.x;
      let tx, ty;
      if (p.role === 'df') {
        tx = ownGoalX(p.team) + dir * clamp(Math.abs(bx - ownGoalX(p.team)) * 0.45, 110, 330);
        ty = H / 2 + (ball.y - H / 2) * 0.5;
      } else {
        tx = clamp(bx + dir * 120, F.l + 60, F.r - 60);
        ty = p.hy + (ball.y - H / 2) * 0.35;
      }
      moveToward(p, tx, ty, 170 * spd, dt);
    }
  }

  // ---------- Física ----------
  function update(dt) {
    if (state === 'goal') {
      pauseTimer -= dt;
      stepBall(dt, true);
      for (const p of players) { steer(p, 0, 0, dt); p.x += p.vx * dt; p.y += p.vy * dt; }
      if (pauseTimer <= 0) {
        if (timeLeft <= 0) return endGame();
        kickoff(lastConceded); state = 'play'; sfx.whistle();
      }
      return;
    }
    if (state !== 'play') return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); return endGame(); }

    for (const p of players) { p.cd = Math.max(0, p.cd - dt); if (p.kickAnim) p.kickAnim = Math.max(0, p.kickAnim - dt); }

    // troca automática do jogador controlado (mais perto da bola)
    const mine = players.filter(p => p.team === 0 && p.role !== 'gk');
    const best = mine.reduce((a, b) => dist(a, ball) < dist(b, ball) ? a : b);
    if (!controlled || (best !== controlled && dist(best, ball) + 30 < dist(controlled, ball) && !charging && !(passTimer > 0 && passTarget === controlled))) controlled = best;

    // quem persegue a bola em cada time
    const chaser = [0, 1].map(t => players.filter(p => p.team === t && p.role !== 'gk')
      .reduce((a, b) => dist(a, ball) < dist(b, ball) ? a : b));
    chaser[0] = controlled;
    // quem vai receber o passe corre para a bola
    if (passTimer > 0) {
      passTimer -= dt;
      if (passTarget.team === 1) chaser[1] = passTarget;
      if (dist(passTarget, ball) < PR + BR + 6) passTimer = 0;
    }

    const cpuSpd = DIFF[diff].speed;
    for (const p of players) {
      if (p === controlled) { controlHuman(p, dt); continue; }
      const spd = p.team === 1 ? cpuSpd : 0.92;
      if (p.role === 'gk') aiGoalkeeper(p, dt, spd);
      else aiFieldPlayer(p, dt, spd, p === chaser[p.team]);
    }

    for (const p of players) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.x = clamp(p.x, F.l - 20, F.r + 20); p.y = clamp(p.y, F.t - 10, F.b + 10);
    }
    // colisão entre jogadores
    for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < PR * 2) {
        const o = (PR * 2 - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      }
    }
    stepBall(dt, false);
    updateHud();
  }

  function controlHuman(p, dt) {
    const d = inputDir();
    const speed = sprintHeld() ? 250 : 190;
    if (!d.x && !d.y && passTimer > 0 && passTarget === p) {
      // recebendo passe sem mexer no controle: vai ao encontro da bola
      moveToward(p, ball.x, ball.y, 200, dt);
    } else {
      steer(p, d.x * speed, d.y * speed, dt);
      if (d.x || d.y) { const m = Math.hypot(d.x, d.y); p.fx = d.x / m; p.fy = d.y / m; }
    }

    // passe para o companheiro mais bem colocado na direção da seta
    const passNow = passHeld();
    if (passNow && !passWas && canKick(p)) {
      const m = bestMate(p, p.fx, p.fy) || players.filter(q => q.team === 0 && q !== p && q.role !== 'gk').sort((a, b) => dist(a, p) - dist(b, p))[0];
      if (m) { passTo(p, m); controlled = m; charging = false; charge = 0; passWas = passNow; return; }
    }
    passWas = passNow;

    const shoot = () => {
      const lift = charge > 0.5 ? (charge - 0.5) * 2 * 320 : 0;   // chute forte sobe
      kickBall(p, p.fx, p.fy, 320 + 620 * charge, lift);
    };
    if (kickHeld()) { charging = true; charge = Math.min(1, charge + dt * 1.4); }
    else if (charging) {
      charging = false;
      if (canKick(p)) shoot();
      charge = 0;
    }
    // chute automático quando a barra enche e a bola está perto
    if (charging && charge >= 1 && canKick(p)) { shoot(); charging = false; charge = 0; }
  }

  let lastConceded = 0;
  function stepBall(dt, frozen) {
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    // altura da bola
    ball.z += ball.vz * dt;
    if (ball.z > 0) ball.vz -= GRAVITY * dt;
    if (ball.z <= 0) {
      ball.z = 0;
      if (ball.vz < -90) ball.vz *= -0.45; else ball.vz = 0;
    }
    const fr = Math.pow(ball.z > 1 ? 0.85 : 0.45, dt);
    ball.vx *= fr; ball.vy *= fr;
    // leve efeito (curva)
    if (Math.hypot(ball.vx, ball.vy) > 300) { ball.vx += -ball.vy * ball.spin * 0.25 * dt; ball.vy += ball.vx * ball.spin * 0.25 * dt; }
    ball.spin *= Math.pow(0.3, dt);

    // colisão bola-jogador (goleiro alcança bolas mais altas)
    if (!frozen) for (const p of players) {
      if (ball.z > (p.role === 'gk' ? 60 : 38)) continue;
      const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < PR + BR) {
        const nx = dx / d, ny = dy / d;
        ball.x = p.x + nx * (PR + BR); ball.y = p.y + ny * (PR + BR);
        const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
        if (rel < 0) { ball.vx -= 1.25 * rel * nx; ball.vy -= 1.25 * rel * ny; ball.vz *= 0.5; }
      }
    }

    // postes do gol
    if (ball.z < CROSSBAR) for (const post of [[F.l, GOAL_TOP], [F.l, GOAL_BOT], [F.r, GOAL_TOP], [F.r, GOAL_BOT]]) {
      const dx = ball.x - post[0], dy = ball.y - post[1], d = Math.hypot(dx, dy);
      if (d > 0 && d < BR + 4) {
        const nx = dx / d, ny = dy / d;
        ball.x = post[0] + nx * (BR + 4); ball.y = post[1] + ny * (BR + 4);
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 1.7 * dot * nx; ball.vy -= 1.7 * dot * ny; sfx.kick(); }
      }
    }

    const inMouth = ball.y > GOAL_TOP && ball.y < GOAL_BOT && ball.z < CROSSBAR - BR;
    // dentro do gol
    if (ball.x < F.l || ball.x > F.r) {
      if (inMouth || ((ball.x < F.l - BR || ball.x > F.r + BR) && ball.y > GOAL_TOP && ball.y < GOAL_BOT)) {
        const leftSide = ball.x < F.l;
        const back = leftSide ? F.l - GOAL_DEPTH + BR : F.r + GOAL_DEPTH - BR;
        if (leftSide ? ball.x < back : ball.x > back) { ball.x = back; ball.vx *= -0.2; }
        if (ball.y < GOAL_TOP + BR) { ball.y = GOAL_TOP + BR; ball.vy = Math.abs(ball.vy) * 0.3; }
        if (ball.y > GOAL_BOT - BR) { ball.y = GOAL_BOT - BR; ball.vy = -Math.abs(ball.vy) * 0.3; }
        if (ball.z > CROSSBAR - BR) { ball.z = CROSSBAR - BR; ball.vz = -Math.abs(ball.vz) * 0.3; }
        if (!frozen && state === 'play' && (leftSide ? ball.x < F.l - BR : ball.x > F.r + BR)) goal(leftSide ? 1 : 0);
        return;
      }
    }
    // paredes invisíveis
    if (ball.x < F.l + BR && !inMouth) { ball.x = F.l + BR; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > F.r - BR && !inMouth) { ball.x = F.r - BR; ball.vx = -Math.abs(ball.vx) * 0.7; }
    if (ball.y < F.t + BR) { ball.y = F.t + BR; ball.vy = Math.abs(ball.vy) * 0.7; }
    if (ball.y > F.b - BR) { ball.y = F.b - BR; ball.vy = -Math.abs(ball.vy) * 0.7; }
  }

      const sh = new THREE.Group(); sh.position.set(s * 11, 36, 0);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.2, 15, 8), skinMat);
      arm.position.y = -7.5; sh.add(arm);
      const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 5, 8), shirtMat);
      sleeve.position.y = -2; sh.add(sleeve);
      g.add(sh); arms.push(sh);
    }
    const head = new THREE.Mesh(new THREE.SphereGeometry(6.5, 16, 12), skinMat);
    head.position.y = 44; g.add(head);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(6.8, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2.2), hairMat);
    hair.position.y = 44.5; g.add(hair);
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    back.castShadow = false;
    scene.add(g);
    return { g, legs, arms };
  }
  function buildPlayerMeshes() {
    for (const m of playerMeshes) scene.remove(m.g);
    playerMeshes = players.map(buildPlayerMesh);
  }

  // câmera
  const camPos = new THREE.Vector3(W / 2, 520, H + 480);
  const camLook = new THREE.Vector3(W / 2, 0, H / 2);
  let lastT = performance.now();

  function syncScene(dt) {
    players.forEach((p, i) => {
      const m = playerMeshes[i]; if (!m) return;
      m.g.position.set(p.x, 0, p.y);
      const target = Math.atan2(p.fx, p.fy);
      let diffA = target - m.g.rotation.y;
      diffA = Math.atan2(Math.sin(diffA), Math.cos(diffA));
      m.g.rotation.y += diffA * Math.min(1, dt * 12);
      const sp = Math.hypot(p.vx, p.vy);
      p.anim += dt * sp * 0.07;
      const swing = Math.sin(p.anim) * Math.min(0.8, sp / 220);
      m.legs[0].rotation.x = swing; m.legs[1].rotation.x = -swing;
      m.arms[0].rotation.x = -swing * 0.8; m.arms[1].rotation.x = swing * 0.8;
      if (p.kickAnim) m.legs[1].rotation.x = -1.2 * Math.sin((p.kickAnim / 0.25) * Math.PI);
      // comemoração
      m.g.position.y = (state === 'goal' && p.team === 1 - lastConceded) ? Math.abs(Math.sin(performance.now() / 150 + i)) * 12 : 0;
    });

    // bola: posição e rotação ao rolar
    ballMesh.position.set(ball.x, BR + ball.z, ball.y);
    const bs = Math.hypot(ball.vx, ball.vy);
    if (bs > 1) {
      const axis = new THREE.Vector3(ball.vy, 0, -ball.vx).normalize();
      const q = new THREE.Quaternion().setFromAxisAngle(axis, bs * dt / BR);
      ballMesh.quaternion.premultiply(q);
    }

    // marcador
    const showMarker = controlled && (state === 'play' || state === 'pause');
    marker.visible = !!showMarker;
    if (showMarker) {
      marker.position.set(controlled.x, 0, controlled.y);
      arrowPivot.rotation.y = Math.atan2(controlled.fx, controlled.fy);
    }

    // barra de força
    chargeWrap.classList.toggle('on', charging && state === 'play');
    chargeEl.style.width = (charge * 100) + '%';
    chargeEl.style.background = charge > 0.5 ? '#ff5533' : '#ffd23f';

    // câmera
    const portrait = camera.aspect < 1;
    let tp, tl;
    if (camMode === 0 || !controlled) {
      const far = portrait ? 1.9 : 1;
      const cx = clamp(ball.x, W / 2 - 330, W / 2 + 330);
      const cz = clamp(ball.y, F.t + 100, F.b - 100);
      tp = new THREE.Vector3(portrait ? cx : W / 2 + (cx - W / 2) * 0.85, 400 * far, cz + 540 * far);
      tl = new THREE.Vector3(cx, 0, cz - 20);
    } else {
      const p = controlled;
      tp = new THREE.Vector3(p.x - 230, 140, p.y + (p.y - H / 2) * 0.15);
      tl = new THREE.Vector3(p.x + 220, 10, (p.y + ball.y) / 2);
    }
    const k = Math.min(1, dt * 3);
    camPos.lerp(tp, k); camLook.lerp(tl, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
  }

  // ---------- Loop ----------
  let acc = 0;
  const STEP = 1 / 120;
  function loop(now) {
    const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    syncScene(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  menu();
  requestAnimationFrame(loop);
})();
</script>
</body>
