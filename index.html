<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Futebol do Henrique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b3d1a; color: #fff; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud { display: flex; align-items: center; gap: 18px; padding: 6px 16px; background: rgba(0,0,0,.45); border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: clamp(16px, 3vw, 26px); }
  .team { display: flex; align-items: center; gap: 8px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
  #score { min-width: 80px; text-align: center; font-size: 1.3em; }
  #time { font-variant-numeric: tabular-nums; opacity: .9; }
  canvas { display: block; max-width: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 10; }
  #overlay.hidden { display: none; }
  .panel { background: #123d22; border: 3px solid #fff; border-radius: 16px; padding: 24px 28px; text-align: center; max-width: 92vw; }
  .panel h1 { font-size: clamp(26px, 6vw, 44px); margin-bottom: 10px; }
  .panel p { margin: 8px 0; line-height: 1.5; opacity: .95; }
  .panel .keys { font-size: 14px; opacity: .85; margin: 14px 0; }
  .btn { display: inline-block; margin: 6px; padding: 12px 22px; font-size: 18px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; background: #ffd23f; color: #222; }
  .btn.sel { outline: 4px solid #fff; }
  .btn.alt { background: #e9e9e9; }
  #msg { position: absolute; top: 45%; left: 0; right: 0; text-align: center; font-size: clamp(40px, 12vw, 110px); font-weight: 900; color: #ffd23f; text-shadow: 0 4px 0 #000, 0 0 30px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #msg.show { opacity: 1; }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #stick { position: absolute; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.15); border: 3px solid rgba(255,255,255,.4); pointer-events: auto; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #kickBtn, #sprintBtn { position: absolute; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #222; }
  #kickBtn { right: 24px; bottom: 30px; width: 100px; height: 100px; background: rgba(255,210,63,.85); font-size: 18px; }
  #sprintBtn { right: 140px; bottom: 20px; width: 70px; height: 70px; background: rgba(255,255,255,.7); font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="team"><div class="dot" style="background:#2f7bff"></div><span>VOCÊ</span></div>
    <div id="score">0 x 0</div>
    <div class="team"><span>CPU</span><div class="dot" style="background:#ff3b3b"></div></div>
    <div id="time">2:00</div>
  </div>
  <canvas id="c" width="1000" height="600"></canvas>
  <div id="msg"></div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="sprintBtn">CORRER</div>
    <div id="kickBtn">CHUTAR</div>
  </div>

  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
(() => {
  // ---------- Configuração do campo ----------
  const W = 1000, H = 600;
  const F = { l: 50, r: 950, t: 30, b: 570 };            // limites do campo
  const GOAL_TOP = 245, GOAL_BOT = 355, GOAL_DEPTH = 32;   // gol
  const MATCH_TIME = 120;
  const PR = 14, BR = 8;                                   // raios jogador / bola

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const msgEl = document.getElementById('msg');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');

  function fit() {
    const hudH = 70;
    const s = Math.min(window.innerWidth / W, (window.innerHeight - hudH) / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  // ---------- Som ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.08) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    kick: () => beep(180, 0.08, 'triangle', 0.15),
    whistle: () => { beep(2200, 0.15, 'sine', 0.06); setTimeout(() => beep(2200, 0.35, 'sine', 0.06), 180); },
    goal: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.07), i * 120)),
  };

  // ---------- Estado ----------
  const DIFF = {
    facil:   { name: 'Fácil',   speed: 0.78, shoot: 260, err: 70 },
    normal:  { name: 'Normal',  speed: 0.92, shoot: 320, err: 45 },
    dificil: { name: 'Difícil', speed: 1.05, shoot: 380, err: 25 },
  };
  let diff = 'normal';
  let players = [], ball, score = [0, 0], timeLeft = MATCH_TIME;
  let state = 'menu';   // menu | play | goal | pause | end
  let pauseTimer = 0, controlled = null, charge = 0, charging = false;

  function makePlayer(team, role, hx, hy, num) {
    return { team, role, hx, hy, x: hx, y: hy, vx: 0, vy: 0, fx: team === 0 ? 1 : -1, fy: 0, num, cd: 0 };
  }

  function setupTeams() {
    players = [
      makePlayer(0, 'gk', 72, 300, 1),
      makePlayer(0, 'df', 250, 300, 4),
      makePlayer(0, 'fw', 400, 190, 9),
      makePlayer(0, 'fw', 400, 410, 10),
      makePlayer(1, 'gk', W - 72, 300, 1),
      makePlayer(1, 'df', W - 250, 300, 4),
      makePlayer(1, 'fw', W - 400, 190, 9),
      makePlayer(1, 'fw', W - 400, 410, 10),
    ];
  }

  function kickoff(towardTeam) {
    for (const p of players) { p.x = p.hx; p.y = p.hy; p.vx = p.vy = 0; p.cd = 0; }
    // o time que sofreu o gol sai com a bola
    const starter = players.find(p => p.team === towardTeam && p.num === 9);
    starter.x = W / 2 + (towardTeam === 0 ? -24 : 24); starter.y = H / 2;
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, spin: 0 };
    controlled = players[2];
    charge = 0; charging = false;
  }

  function newGame() {
    score = [0, 0]; timeLeft = MATCH_TIME;
    setupTeams();
    kickoff(0);
    state = 'play';
    overlay.classList.add('hidden');
    updateHud();
    sfx.whistle();
  }

  function updateHud() {
    scoreEl.textContent = `${score[0]} x ${score[1]}`;
    const t = Math.max(0, Math.ceil(timeLeft));
    timeEl.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }

  function flash(text, ms = 1500) {
    msgEl.textContent = text; msgEl.classList.add('show');
    clearTimeout(flash.t); flash.t = setTimeout(() => msgEl.classList.remove('show'), ms);
  }

  // ---------- Entrada ----------
  const keys = {};
  const touchIn = { x: 0, y: 0, kick: false, sprint: false };
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;
    if ((k === 'p' || k === 'escape') && (state === 'play' || state === 'pause')) togglePause();
    if (k === 'enter' && (state === 'menu' || state === 'end')) newGame();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function kickHeld() { return keys[' '] || keys['k'] || keys['j'] || touchIn.kick; }
  function sprintHeld() { return keys['shift'] || keys['l'] || touchIn.sprint; }
  function inputDir() {
    let x = 0, y = 0;
    if (keys['arrowleft'] || keys['a']) x -= 1;
    if (keys['arrowright'] || keys['d']) x += 1;
    if (keys['arrowup'] || keys['w']) y -= 1;
    if (keys['arrowdown'] || keys['s']) y += 1;
    x += touchIn.x; y += touchIn.y;
    const m = Math.hypot(x, y);
    return m > 1 ? { x: x / m, y: y / m } : { x, y };
  }

  // Controles de toque
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) document.getElementById('touch').classList.add('on');
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let stickId = null;
  function stickMove(t) {
    const r = stick.getBoundingClientRect();
    let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
    const max = r.width / 2, m = Math.hypot(dx, dy);
    if (m > max) { dx = dx / m * max; dy = dy / m * max; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    touchIn.x = dx / max; touchIn.y = dy / max;
  }
  stick.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; stickId = t.identifier; stickMove(t); });
  stick.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === stickId) stickMove(t); });
  const stickEnd = e => { for (const t of e.changedTouches) if (t.identifier === stickId) { stickId = null; touchIn.x = touchIn.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('touchend', stickEnd); stick.addEventListener('touchcancel', stickEnd);
  function holdBtn(el, prop) {
    el.addEventListener('touchstart', e => { e.preventDefault(); touchIn[prop] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); touchIn[prop] = false; });
    el.addEventListener('touchcancel', () => { touchIn[prop] = false; });
  }
  holdBtn(document.getElementById('kickBtn'), 'kick');
  holdBtn(document.getElementById('sprintBtn'), 'sprint');

  // ---------- Utilidades ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);
  function goalX(team) { return team === 0 ? F.r : F.l; }          // gol que o time ATACA
  function ownGoalX(team) { return team === 0 ? F.l : F.r; }

  function kickBall(p, dx, dy, power) {
    const m = Math.hypot(dx, dy) || 1;
    ball.vx = dx / m * power; ball.vy = dy / m * power;
    ball.spin = rand(-1, 1);
    p.cd = 0.35;
    sfx.kick();
  }

  function canKick(p) { return p.cd <= 0 && dist(p, ball) < PR + BR + 10; }

  // ---------- IA ----------
  function moveToward(p, tx, ty, speed, dt) {
    const dx = tx - p.x, dy = ty - p.y, m = Math.hypot(dx, dy);
    let dvx = 0, dvy = 0;
    if (m > 3) { const s = Math.min(speed, m * 6); dvx = dx / m * s; dvy = dy / m * s; }
    steer(p, dvx, dvy, dt);
  }

  function steer(p, dvx, dvy, dt) {
    const a = Math.min(1, dt * 10);
    p.vx += (dvx - p.vx) * a; p.vy += (dvy - p.vy) * a;
    const m = Math.hypot(p.vx, p.vy);
    if (m > 20) { p.fx = p.vx / m; p.fy = p.vy / m; }
  }

  function aiGoalkeeper(p, dt, spd) {
    const gx = ownGoalX(p.team), dir = p.team === 0 ? 1 : -1;
    const ballNear = Math.abs(ball.x - gx) < 170 && ball.y > GOAL_TOP - 80 && ball.y < GOAL_BOT + 80;
    let tx, ty;
    if (ballNear) { tx = ball.x; ty = ball.y; }
    else {
      tx = gx + dir * 22;
      // antecipa trajetória da bola
      let py = ball.y;
      if (ball.vx * dir < -50) { const t = (tx - ball.x) / ball.vx; if (t > 0 && t < 2) py = ball.y + ball.vy * t; }
      ty = clamp(py, GOAL_TOP + 8, GOAL_BOT - 8);
    }
    tx = clamp(tx, Math.min(gx, gx + dir * 120), Math.max(gx, gx + dir * 120));
    moveToward(p, tx, ty, 190 * spd, dt);
    if (canKick(p)) {
      const mate = players.filter(q => q.team === p.team && q.role !== 'gk').sort((a, b) => dist(a, p) - dist(b, p))[1];
      const target = mate || { x: W / 2, y: H / 2 };
      kickBall(p, target.x - p.x + dir * 150, target.y - p.y, 620);
    }
  }

  function aiFieldPlayer(p, dt, spd, isChaser) {
    const cfg = DIFF[diff];
    const gx = goalX(p.team), dir = p.team === 0 ? 1 : -1;
    const isCpu = p.team === 1;
    const shootRange = isCpu ? cfg.shoot : 320;
    const err = isCpu ? cfg.err : 45;

    if (isChaser) {
      // posicionar atrás da bola em relação ao gol adversário
      const gdx = gx - ball.x, gdy = H / 2 - ball.y, gm = Math.hypot(gdx, gdy);
      const ux = gdx / gm, uy = gdy / gm;
      const toBx = ball.x - p.x, toBy = ball.y - p.y, tm = Math.hypot(toBx, toBy) || 1;
      const behind = (toBx * ux + toBy * uy) / tm;
      let tx, ty;
      if (behind > 0.3 || tm > 120) { tx = ball.x - ux * 6 + ball.vx * 0.12; ty = ball.y - uy * 6 + ball.vy * 0.12; }
      else { // contornar a bola
        const side = (toBx * uy - toBy * ux) > 0 ? 1 : -1;
        tx = ball.x - ux * 30 - uy * 24 * side; ty = ball.y - uy * 30 + ux * 24 * side;
      }
      moveToward(p, tx, ty, 230 * spd, dt);

      if (canKick(p)) {
        const dGoal = Math.hypot(gx - p.x, H / 2 - p.y);
        if (dGoal < shootRange) {
          kickBall(p, gx - p.x, rand(GOAL_TOP + 12, GOAL_BOT - 12) + rand(-err, err) * 0.5 - p.y, 780);
        } else {
          // pressão adversária? passa para companheiro livre
          const opp = players.filter(q => q.team !== p.team && dist(q, p) < 55 && (q.x - p.x) * dir > 0);
          if (opp.length) {
            const mates = players.filter(q => q.team === p.team && q !== p && q.role !== 'gk' && (q.x - p.x) * dir > -40);
            if (mates.length) {
              const m = mates[Math.floor(Math.random() * mates.length)];
              kickBall(p, m.x + dir * 40 - p.x, m.y - p.y, 520);
            } else kickBall(p, dir, rand(-0.4, 0.4), 600);
          } else if (behind > 0.6) {
            // conduzir: toque curto para frente
            kickBall(p, ux, uy, 260 * spd);
            p.cd = 0.25;
          }
        }
      }
    } else {
      // posição tática
      const bx = ball.x;
      let tx, ty;
      if (p.role === 'df') {
        tx = ownGoalX(p.team) + dir * clamp(Math.abs(bx - ownGoalX(p.team)) * 0.45, 110, 330);
        ty = H / 2 + (ball.y - H / 2) * 0.5;
      } else {
        tx = clamp(bx + dir * 120, F.l + 60, F.r - 60);
        ty = p.hy + (ball.y - H / 2) * 0.35;
      }
      moveToward(p, tx, ty, 170 * spd, dt);
    }
  }

  // ---------- Física ----------
  function update(dt) {
    if (state === 'goal') {
      pauseTimer -= dt;
      stepBall(dt, true);
      if (pauseTimer <= 0) {
        if (timeLeft <= 0) return endGame();
        kickoff(lastConceded); state = 'play'; sfx.whistle();
      }
      return;
    }
    if (state !== 'play') return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); return endGame(); }

    for (const p of players) p.cd = Math.max(0, p.cd - dt);

    // troca automática do jogador controlado (mais perto da bola)
    const mine = players.filter(p => p.team === 0 && p.role !== 'gk');
    const best = mine.reduce((a, b) => dist(a, ball) < dist(b, ball) ? a : b);
    if (!controlled || (best !== controlled && dist(best, ball) + 30 < dist(controlled, ball) && !charging)) controlled = best;

    // quem persegue a bola em cada time
    const chaser = [0, 1].map(t => players.filter(p => p.team === t && p.role !== 'gk')
      .reduce((a, b) => dist(a, ball) < dist(b, ball) ? a : b));
    chaser[0] = controlled;

    const cpuSpd = DIFF[diff].speed;
    for (const p of players) {
      if (p === controlled) { controlHuman(p, dt); continue; }
      const spd = p.team === 1 ? cpuSpd : 0.92;
      if (p.role === 'gk') aiGoalkeeper(p, dt, spd);
      else aiFieldPlayer(p, dt, spd, p === chaser[p.team]);
    }

    for (const p of players) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.x = clamp(p.x, F.l - 20, F.r + 20); p.y = clamp(p.y, F.t - 10, F.b + 10);
    }
    // colisão entre jogadores
    for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < PR * 2) {
        const o = (PR * 2 - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      }
    }
    stepBall(dt, false);
    updateHud();
  }

  function controlHuman(p, dt) {
    const d = inputDir();
    const speed = sprintHeld() ? 250 : 190;
    steer(p, d.x * speed, d.y * speed, dt);
    if (d.x || d.y) { const m = Math.hypot(d.x, d.y); p.fx = d.x / m; p.fy = d.y / m; }

    if (kickHeld()) { charging = true; charge = Math.min(1, charge + dt * 1.4); }
    else if (charging) {
      charging = false;
      if (canKick(p)) kickBall(p, p.fx, p.fy, 320 + 620 * charge);
      charge = 0;
    }
    // chute rápido automático se segurar muito perto
    if (charging && charge >= 1 && canKick(p)) { kickBall(p, p.fx, p.fy, 940); charging = false; charge = 0; }
  }

  let lastConceded = 0;
  function stepBall(dt, frozen) {
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const fr = Math.pow(0.45, dt);
    ball.vx *= fr; ball.vy *= fr;
    // leve efeito (curva)
    if (Math.hypot(ball.vx, ball.vy) > 300) { ball.vx += -ball.vy * ball.spin * 0.25 * dt; ball.vy += ball.vx * ball.spin * 0.25 * dt; }
    ball.spin *= Math.pow(0.3, dt);

    // colisão bola-jogador
    if (!frozen) for (const p of players) {
      const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < PR + BR) {
        const nx = dx / d, ny = dy / d;
        ball.x = p.x + nx * (PR + BR); ball.y = p.y + ny * (PR + BR);
        const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
        if (rel < 0) { ball.vx -= 1.25 * rel * nx; ball.vy -= 1.25 * rel * ny; }
      }
    }

    // postes do gol
    for (const post of [[F.l, GOAL_TOP], [F.l, GOAL_BOT], [F.r, GOAL_TOP], [F.r, GOAL_BOT]]) {
      const dx = ball.x - post[0], dy = ball.y - post[1], d = Math.hypot(dx, dy);
      if (d > 0 && d < BR + 4) {
        const nx = dx / d, ny = dy / d;
        ball.x = post[0] + nx * (BR + 4); ball.y = post[1] + ny * (BR + 4);
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 1.7 * dot * nx; ball.vy -= 1.7 * dot * ny; sfx.kick(); }
      }
    }

    const inMouth = ball.y > GOAL_TOP && ball.y < GOAL_BOT;
    // dentro do gol
    if (ball.x < F.l || ball.x > F.r) {
      if (inMouth || ball.x < F.l - BR || ball.x > F.r + BR) {
        const leftSide = ball.x < F.l;
        const back = leftSide ? F.l - GOAL_DEPTH + BR : F.r + GOAL_DEPTH - BR;
        if (leftSide ? ball.x < back : ball.x > back) { ball.x = back; ball.vx *= -0.2; }
        if (ball.y < GOAL_TOP + BR) { ball.y = GOAL_TOP + BR; ball.vy = Math.abs(ball.vy) * 0.3; }
        if (ball.y > GOAL_BOT - BR) { ball.y = GOAL_BOT - BR; ball.vy = -Math.abs(ball.vy) * 0.3; }
        if (!frozen && state === 'play' && (leftSide ? ball.x < F.l - BR : ball.x > F.r + BR)) goal(leftSide ? 1 : 0);
        return;
      }
    }
    // paredes
    if (ball.x < F.l + BR && !inMouth) { ball.x = F.l + BR; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > F.r - BR && !inMouth) { ball.x = F.r - BR; ball.vx = -Math.abs(ball.vx) * 0.7; }
    if (ball.y < F.t + BR) { ball.y = F.t + BR; ball.vy = Math.abs(ball.vy) * 0.7; }
    if (ball.y > F.b - BR) { ball.y = F.b - BR; ball.vy = -Math.abs(ball.vy) * 0.7; }
  }

  function goal(team) {
    score[team]++;
    lastConceded = 1 - team;
    state = 'goal'; pauseTimer = 2.2;
    updateHud();
    flash(team === 0 ? 'GOOOL!' : 'GOL DA CPU', 2000);
    sfx.goal();
  }

  function endGame() {
    state = 'end';
    sfx.whistle();
    const [a, b] = score;
    const title = a > b ? '🏆 VOCÊ VENCEU!' : a < b ? 'A CPU venceu 😢' : 'Empate!';
    showPanel(`<h1>${title}</h1><p style="font-size:28px;font-weight:800">${a} x ${b}</p>
      ${diffButtons()}<div><button class="btn" id="go">Jogar de novo</button></div>`);
  }

  function togglePause() {
    if (state === 'play') {
      state = 'pause';
      showPanel(`<h1>Pausado</h1><button class="btn" id="resume">Continuar</button><button class="btn alt" id="quit">Menu</button>`);
      document.getElementById('resume').onclick = togglePause;
      document.getElementById('quit').onclick = menu;
    } else if (state === 'pause') { state = 'play'; overlay.classList.add('hidden'); }
  }

  // ---------- Menus ----------
  function diffButtons() {
    return `<p>Dificuldade:</p><div>` + Object.entries(DIFF).map(([k, v]) =>
      `<button class="btn alt ${k === diff ? 'sel' : ''}" data-diff="${k}">${v.name}</button>`).join('') + `</div>`;
  }
  function showPanel(html) {
    panel.innerHTML = html;
    overlay.classList.remove('hidden');
    panel.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => {
      diff = b.dataset.diff;
      panel.querySelectorAll('[data-diff]').forEach(x => x.classList.toggle('sel', x === b));
    });
    const go = document.getElementById('go');
    if (go) go.onclick = newGame;
  }
  function menu() {
    state = 'menu';
    setupTeams(); kickoff(0);
    showPanel(`<h1>⚽ Futebol do Henrique</h1>
      <p>Você é o time <b style="color:#6fa8ff">AZUL</b>. Faça mais gols que a CPU em 2 minutos!</p>
      <div class="keys">
        <b>Mover:</b> setas ou WASD &nbsp;·&nbsp; <b>Chutar:</b> Espaço (segure para chute forte)<br>
        <b>Correr:</b> Shift &nbsp;·&nbsp; <b>Pausar:</b> P ou Esc<br>
        No celular: use o joystick e os botões na tela.
      </div>
      ${diffButtons()}
      <div><button class="btn" id="go">Começar!</button></div>`);
  }

  // ---------- Desenho ----------
  function drawField() {
    const stripes = 10, sw = (F.r - F.l) / stripes;
    ctx.fillStyle = '#2e8b3e'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = i % 2 ? '#33963f' : '#2c8539';
      ctx.fillRect(F.l + i * sw, F.t, sw, F.b - F.t);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
    ctx.strokeRect(F.l, F.t, F.r - F.l, F.b - F.t);
    ctx.beginPath(); ctx.moveTo(W / 2, F.t); ctx.lineTo(W / 2, F.b); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2); ctx.fill();
    for (const side of [0, 1]) {
      const x = side ? F.r : F.l, d = side ? -1 : 1;
      ctx.strokeRect(Math.min(x, x + d * 140), H / 2 - 150, 140, 300);
      ctx.strokeRect(Math.min(x, x + d * 55), H / 2 - 80, 55, 160);
      ctx.beginPath(); ctx.arc(x + d * 105, H / 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath();
      ctx.rect(side ? 0 : x + d * 140, 0, side ? x + d * 140 : W, H); ctx.clip();
      ctx.beginPath(); ctx.arc(x + d * 105, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // gols com rede
    for (const side of [0, 1]) {
      const x0 = side ? F.r : F.l - GOAL_DEPTH;
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x0, GOAL_TOP, GOAL_DEPTH, GOAL_BOT - GOAL_TOP);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      for (let x = x0; x <= x0 + GOAL_DEPTH; x += 8) { ctx.beginPath(); ctx.moveTo(x, GOAL_TOP); ctx.lineTo(x, GOAL_BOT); ctx.stroke(); }
      for (let y = GOAL_TOP; y <= GOAL_BOT; y += 8) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + GOAL_DEPTH, y); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.strokeRect(x0, GOAL_TOP, GOAL_DEPTH, GOAL_BOT - GOAL_TOP);
    }
  }

  function drawPlayer(p) {
    const colors = p.team === 0 ? ['#2f7bff', '#153f8f'] : ['#ff3b3b', '#8f1515'];
    const gkColors = p.team === 0 ? ['#ffd23f', '#9a7a10'] : ['#9b59ff', '#4a1f8f'];
    const [c1, c2] = p.role === 'gk' ? gkColors : colors;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 5, PR, PR * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    if (p === controlled) {
      ctx.strokeStyle = '#ffff66'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, PR + 6, 0, Math.PI * 2); ctx.stroke();
      // seta indicando a direção do chute
      ctx.fillStyle = '#ffff66';
      const ax = p.x + p.fx * (PR + 14), ay = p.y + p.fy * (PR + 14);
      ctx.beginPath();
      ctx.moveTo(ax + p.fx * 8, ay + p.fy * 8);
      ctx.lineTo(ax - p.fy * 6, ay + p.fx * 6);
      ctx.lineTo(ax + p.fy * 6, ay - p.fx * 6);
      ctx.fill();
    }
    ctx.fillStyle = c1; ctx.strokeStyle = c2; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.num, p.x, p.y + 1);
    if (p === controlled && charging) {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(p.x - 20, p.y - PR - 16, 40, 6);
      ctx.fillStyle = charge > 0.7 ? '#ff5533' : '#ffd23f'; ctx.fillRect(p.x - 20, p.y - PR - 16, 40 * charge, 6);
    }
  }

  function drawBall() {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 4, BR, BR * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    drawField();
    [...players].sort((a, b) => a.y - b.y).forEach(drawPlayer);
    drawBall();
  }

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  menu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
